# Passthrough TCP para los dos puertos que llevan TLS mutuo.
#
# nginx reparte bytes y **no mira dentro**. El handshake ocurre entre el DataNode y el
# ControlNode que le toque: los dos se validan contra la misma CA, y el balanceador ni
# tiene certificado ni lo necesita. Ver el comentario largo de nginx.conf.

# --- gRPC del plano de control: DataNode -> ControlNode --------------------
upstream dfsha_control_grpc {
    # least_conn y no hash: los DataNodes son pocos y cada uno abre UNA conexion larga,
    # asi que lo que hay que repartir son conexiones, no peticiones. least_conn manda
    # cada nodo nuevo a la instancia con menos streams abiertos, que es justo lo que se
    # quiere cuando un ControlNode se reinicia y los nodos reconectan a la vez.
    least_conn;
    server control-node-1:9000 max_fails=2 fail_timeout=5s;
    server control-node-2:9000 max_fails=2 fail_timeout=5s;
    server control-node-3:9000 max_fails=2 fail_timeout=5s;
}

server {
    listen 9000;
    proxy_pass dfsha_control_grpc;

    # El stream de Heartbeat se queda abierto entre latidos. Con un timeout corto nginx
    # lo cortaria periodicamente y el DataNode reconectaria sin parar: el sintoma serian
    # reconexiones ritmicas que parecen un problema de red y no lo son. Una hora es de
    # sobra, porque quien detecta un nodo mudo es el evaluador de pertenencia por el
    # heartbeat, no el estado del socket.
    proxy_timeout 1h;
    proxy_connect_timeout 3s;

    # Si la instancia elegida no acepta la conexion, se prueba otra. Esto es seguro
    # porque ocurre ANTES de que viaje ningun byte de aplicacion: no reintenta nada a
    # medias.
    proxy_next_upstream on;
    proxy_next_upstream_tries 2;
}

# --- Plano interno REST: DataNode y GC -> ControlNode ----------------------
#
# Aqui van /internal/v1/blocks/{id}/stored y los dos endpoints del GC. El primero es
# SINCRONO y anterior al 201 que el DataNode devuelve al cliente (ver "Alcance de gRPC"),
# asi que su latencia esta en el camino critico de cada bloque subido: los timeouts son
# cortos a proposito.
upstream dfsha_control_internal {
    least_conn;
    server control-node-1:8443 max_fails=2 fail_timeout=5s;
    server control-node-2:8443 max_fails=2 fail_timeout=5s;
    server control-node-3:8443 max_fails=2 fail_timeout=5s;
}

server {
    listen 8443;
    proxy_pass dfsha_control_internal;

    proxy_timeout 60s;
    proxy_connect_timeout 3s;
    proxy_next_upstream on;
    proxy_next_upstream_tries 2;
}
