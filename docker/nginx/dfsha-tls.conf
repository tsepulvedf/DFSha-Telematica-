# Balanceador delante de los tres ControlNodes, con TLS de CLIENTE (C2) encendido.
#
# Lo monta `docker-compose.tls.yml` EN LUGAR de `dfsha.conf`. Sin ese fichero, el stack
# sigue en HTTP plano, que es el default y el modo de desarrollo.
#
# ## Por que aqui SI se termina TLS, cuando en :8443 y :9000 no
#
# `dfsha-stream.conf` explica por que el plano interno va en nivel 4: un proxy que termina
# TLS se queda el certificado del DataNode, y en el plano interno el certificado ES la
# identidad. En el plano de cliente no: la identidad es el JWT, que viaja DENTRO de la
# peticion y llega intacto al ControlNode. Terminar aqui no le quita a nadie nada que
# necesite, y conserva lo que justifica el nivel 7 en este puerto: `least_conn` por
# peticion y el reintento en otra instancia.
#
# ## Y se vuelve a cifrar hacia el ControlNode, verificando
#
# Terminar TLS en nginx y seguir en HTTP hasta el ControlNode dejaria el JWT en claro en
# la red interna, y ademas el TLS de cliente del ControlNode —el codigo de C2— no se
# ejercitaria nunca en este despliegue. Asi que nginx habla HTTPS con cada instancia y
# **verifica su certificado contra la CA del proyecto** (`proxy_ssl_verify on`): sin eso,
# el segundo tramo cifraria contra cualquiera que contestara en esa IP.
#
# `proxy_ssl_name lb`: nginx verifica el certificado contra ese nombre, no contra el del
# `upstream`, que no es un host. `lb` esta en el SAN de control.crt precisamente porque es
# el nombre por el que se llega a los ControlNodes.

upstream dfsha_control_rest {
    least_conn;
    server control-node-1:8000 max_fails=2 fail_timeout=5s;
    server control-node-2:8000 max_fails=2 fail_timeout=5s;
    server control-node-3:8000 max_fails=2 fail_timeout=5s;
}

# --- REST: cliente -> nginx (TLS) -> ControlNode (TLS verificado) -------------
server {
    listen 8000 ssl;
    server_name _;

    # El certificado que ve el USUARIO. En desarrollo es el de control, que lleva
    # `localhost` en el SAN; en un despliegue real seria el del nombre publico.
    ssl_certificate     /etc/nginx/certs/control.crt;
    ssl_certificate_key /etc/nginx/certs/control.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    location / {
        proxy_pass https://dfsha_control_rest;
        proxy_http_version 1.1;

        proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
        proxy_ssl_verify              on;
        proxy_ssl_verify_depth        2;
        proxy_ssl_name                lb;
        proxy_ssl_protocols           TLSv1.2 TLSv1.3;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
}

# --- Sonda de salud, solo desde dentro del contenedor ------------------------
#
# El healthcheck del contenedor usa el `wget` de busybox, que no sabe verificar contra una
# CA propia. En vez de desactivar la verificacion, la sonda entra por aqui en HTTP y ESTE
# bloque habla HTTPS verificado con los ControlNodes: lo que se comprueba es el tramo que
# de verdad puede romperse. Escucha solo en 127.0.0.1 y no se publica.
server {
    listen 127.0.0.1:8081;

    location = /health {
        proxy_pass https://dfsha_control_rest;
        proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
        proxy_ssl_verify              on;
        proxy_ssl_name                lb;
    }
}
