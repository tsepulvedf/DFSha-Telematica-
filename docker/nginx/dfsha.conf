# Balanceador delante de los tres ControlNodes.
#
# El cliente habla siempre con :8000 y no sabe (ni debe saber) cual le atiende. Eso es
# posible porque el ControlNode es **stateless**: no guarda sesiones, el token JWT lleva
# la identidad, y el cwd del cliente vive en el cliente. Es la decision de la Etapa 1
# cobrandose aqui; si hubiera sesion en memoria, harian falta sesiones pegajosas y este
# fichero seria mucho mas complicado.
#
# El liderazgo NO se decide aqui. nginx reparte peticiones; quien manda lo decide el
# lease en PostgreSQL. Son dos cosas distintas y conviene no mezclarlas: una peticion
# puede caer en una instancia que no es la lider y aun asi servirse bien, porque las
# lecturas, los planes y la autenticacion no necesitan liderazgo.
#
# AQUI SOLO VA EL REST DEL CLIENTE. El plano interno (:8443) y el gRPC del plano de
# control (:9000) llevan TLS mutuo y viven en `dfsha-stream.conf`, como passthrough de
# nivel 4: un proxy HTTP termina TLS y el certificado del DataNode no llegaria nunca al
# ControlNode. Si alguna vez reaparece aqui un `grpc_pass`, es ese fallo otra vez.

upstream dfsha_control_rest {
    # least_conn y no round-robin: las peticiones del ControlNode duran cosas muy
    # distintas (un `ls` son microsegundos, un `files/create` de un archivo grande
    # coloca decenas de bloques). Repartir por turnos manda trabajo a una instancia
    # ocupada mientras otra esta libre.
    least_conn;
    server control-node-1:8000 max_fails=2 fail_timeout=5s;
    server control-node-2:8000 max_fails=2 fail_timeout=5s;
    server control-node-3:8000 max_fails=2 fail_timeout=5s;
}

# --- REST: cliente -> ControlNode ------------------------------------------
server {
    listen 8000;
    server_name _;

    # Los cuerpos que pasan por aqui son metadatos, no bloques: los bytes van directos
    # del cliente al DataNode. 1 MB sobra y de paso acota el dano de una peticion
    # absurda.
    client_max_body_size 1m;

    location / {
        proxy_pass http://dfsha_control_rest;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Si la instancia que atendio se cae a mitad, se reintenta en otra. Solo para
        # peticiones que nginx considera seguras de repetir; un POST que ya empezo a
        # procesarse NO se reintenta, porque repetir un commit no es inocuo.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
}
