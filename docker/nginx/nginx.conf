# Configuracion principal de nginx. Sustituye a la de la imagen porque hace falta un
# bloque `stream`, y ese solo existe al nivel mas alto del fichero: no se puede anadir
# desde `conf.d/`, que la imagen incluye DENTRO de `http`.
#
# Por que hay dos niveles y no uno solo, que es lo que hay que defender:
#
#   :8000  REST del cliente        -> proxy HTTP (nivel 7). nginx lee la peticion,
#                                     reparte por least_conn y puede reintentar.
#   :8443  plano interno (mTLS)    -> passthrough TCP (nivel 4)
#   :9000  gRPC del plano de control (mTLS) -> passthrough TCP (nivel 4)
#
# Los dos ultimos NO pueden pasar por el nivel 7. Un proxy HTTP **termina TLS**: abre la
# conexion, la lee y abre otra distinta hacia el ControlNode. El certificado que el
# DataNode presenta muere en nginx, y al otro lado llega una conexion anonima. Eso no es
# un detalle de rendimiento: **destruye el proposito entero del mTLS**, que es que el
# ControlNode sepa QUIEN esta al otro lado. Se podria reinyectar la identidad en una
# cabecera, pero entonces la garantia pasa a ser "confia en lo que dice el balanceador",
# que es exactamente el secreto compartido del que el Bloque C se deshizo.
#
# Con `stream`, nginx reparte bytes sin mirarlos: el handshake es de punta a punta,
# ControlNode y DataNode se validan entre si, y el balanceador no necesita ver —ni
# tener— ningun certificado.
#
# Lo que se pierde, dicho para que nadie lo descubra por sorpresa: el reparto pasa a ser
# POR CONEXION y no por peticion, y nginx ya no puede reintentar en otra instancia a
# mitad de una peticion. Para estos dos puertos da igual, y para gRPC es incluso mas
# apropiado: el stream de Heartbeat es una conexion larga que se abre una vez y dura
# horas, asi que el balanceo por peticion no le aportaba nada.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}

# Nivel 4. Todo lo que lleva mTLS pasa por aqui sin tocarse.
stream {
    log_format  proxy  '$remote_addr [$time_local] $protocol $status '
                       '$bytes_sent $bytes_received $session_time "$upstream_addr"';

    access_log  /var/log/nginx/stream.log  proxy;

    include /etc/nginx/stream.conf.d/*.conf;
}
