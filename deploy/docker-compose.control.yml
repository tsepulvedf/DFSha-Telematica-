# ControlNode en su propia instancia t3.micro.
#
# Un solo servicio a proposito: t3.micro es 1 GB de RAM. El .env se lee de la raiz
# del repositorio, no de deploy/, porque es donde lo deja el README.
#
#   docker compose -f deploy/docker-compose.control.yml up --build -d
#   docker compose -f deploy/docker-compose.control.yml logs -f

name: "dfsha-control"

services:
  control-node:
    build:
      context: ".."
      dockerfile: "docker/control_node.Dockerfile"
    image: "dfsha/control-node:0.2.0"
    container_name: "dfsha-control-node"
    env_file:
      - "../.env"
    ports:
      # 8000 REST: lo abre el grupo de seguridad al propio grupo (el DataNode
      # confirma cada bloque) y a tu IP (para usar el cliente).
      - "8000:8000"
      # 9000 gRPC: SOLO al propio grupo. El plano de control no tiene
      # autenticacion mutua hasta la Etapa 3; hoy la frontera es la red.
      - "9000:9000"
    environment:
      DFSHA_DB_URL: "sqlite:////var/lib/dfsha-meta/dfsha.db"
      DFSHA_GRPC_PORT: "9000"
    volumes:
      - "dfsha-meta:/var/lib/dfsha-meta"
    restart: "unless-stopped"

volumes:
  dfsha-meta:
