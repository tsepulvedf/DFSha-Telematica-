# dfsha-control: el PRIMER ControlNode, en su propia t3.micro. El segundo corre en dfsha-db
# junto a PostgreSQL y el balanceador; ver deploy/docker-compose.db.yml.
#
#   docker compose -f deploy/docker-compose.control.yml up --build -d
#   docker compose -f deploy/docker-compose.control.yml logs -f
#
# Esta instancia es tambien donde corre el CLIENTE (opcion (a) del README, la soportada).
#
# Nada llega a este ControlNode directamente: DataNodes y cliente hablan con nginx en
# dfsha-db, que reparte entre los dos. Por eso matarlo no interrumpe el servicio.
#
# SIN INTERPOLACION: todo valor que cambia por despliegue esta escrito en el .env, que es
# el MISMO fichero que el de dfsha-db. Ver la cabecera de docker-compose.db.yml.

name: "dfsha-control"

services:
  control-node:
    build:
      context: ".."
      dockerfile: "docker/control_node.Dockerfile"
    image: "dfsha/control-node:0.3.0"
    container_name: "dfsha-control-node-a"
    env_file:
      - "../.env"
    ports:
      # Los tres, SOLO al propio grupo de seguridad: quien los usa es nginx en dfsha-db.
      - "8000:8000"   # REST de cliente, con TLS (C2)
      - "8443:8443"   # plano interno, mTLS
      - "9000:9000"   # gRPC del plano de control, mTLS
    volumes:
      # Solo lectura, y SOLO los tres ficheros que le tocan: ca.key no sale de la maquina
      # que firma. Ver el paso 4 del README.
      - "/etc/dfsha/certs:/etc/dfsha/certs:ro"
    restart: "unless-stopped"
