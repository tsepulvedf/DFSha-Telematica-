# Un DataNode en su propia instancia t3.micro.
#
# Un solo servicio a proposito: cada subida concurrente guarda un bloque entero en memoria,
# y t3.micro es 1 GB. Dos DataNodes en la misma maquina acaban en OOM a mitad de un put, y
# ademas anularian el sentido de los dominios de falla.
#
# SIN INTERPOLACION. Las direcciones (la propia, la de par y la de nginx en dfsha-db) estan
# ESCRITAS en el .env y entran por env_file. La version anterior de este fichero componia la
# URL del plano interno con ${DFSHA_CONTROL_PRIVATE_IP}, que compose lee del .env de
# deploy/ y no del de la raiz: la URL salia "https://:8443" y, como `environment:` gana a
# `env_file`, pisaba la correcta del .env. Ningun put habria confirmado. Nadie lo vio porque
# este despliegue no se habia ejecutado nunca.
#
#   docker compose -f deploy/docker-compose.datanode.yml up --build -d
#   docker compose -f deploy/docker-compose.datanode.yml logs -f

name: "dfsha-datanode"

services:
  data-node:
    build:
      context: ".."
      dockerfile: "docker/data_node.Dockerfile"
    image: "dfsha/data-node:0.3.0"
    container_name: "dfsha-data-node"
    env_file:
      - "../.env"
    environment:
      # Estructural: es donde se monta el volumen de abajo, no un valor del despliegue.
      DFSHA_DATA_DIR: "/var/lib/dfsha"
    ports:
      # Mismo puerto en las cuatro instancias: cada una tiene su propia IP. El 8001-8004
      # del compose local existe solo porque alli los cuatro comparten el host.
      - "8001:8001"
    volumes:
      # node.json (data_node_id y boot_id) vive aqui, junto a los bloques. Perder el
      # volumen es perder el boot_id, y eso es justo lo que le dice al ControlNode que las
      # replicas de este nodo ya no existen.
      - "dfsha-blocks:/var/lib/dfsha"
      # Solo los tres ficheros de este rol, en solo lectura. Ver el paso 4 del README.
      - "/etc/dfsha/certs:/etc/dfsha/certs:ro"
    restart: "unless-stopped"

volumes:
  dfsha-blocks:
