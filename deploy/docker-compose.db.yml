# dfsha-db: PostgreSQL, el SEGUNDO ControlNode y el balanceador, en una t3.micro.
#
#   docker compose -f deploy/docker-compose.db.yml up --build -d
#
# ## Tres servicios en una instancia, y por que no contradice "una instancia, un servicio"
#
# Esa regla nacio por los DATANODES: cada subida concurrente guarda un bloque entero en
# memoria (hasta 64 MB), y dos DataNodes en 1 GB acaban en OOM a mitad de un put; ademas
# compartir maquina anularia los dominios de falla. Nada de eso aplica aqui:
#
#   - El ControlNode NO tiene estado propio: todo vive en PostgreSQL. Juntarlo con la base
#     no vuelve a juntar el metadato en un disco, que era el motivo de separarla.
#   - Los bytes de los archivos NUNCA atraviesan el ControlNode (decision 4 de CLAUDE.md):
#     no guarda bloques en memoria, y su consumo no crece con el tamano de las subidas.
#
# Medido en el compose local, en reposo: ControlNode 90-95 MiB, PostgreSQL 62 MiB, nginx
# 20 MiB. Con Ubuntu y Docker (~300 MB) y PostgreSQL con carga (hasta ~200 MB), el total
# queda en ~500-650 MB de los ~950 utiles. El swapfile de 1 GB del paso 3 es la red de
# seguridad, no el plan.
#
# ## Por que el balanceador va aqui y no hay septima instancia
#
# Sin balanceador, los DataNodes y el cliente apuntan a UNA IP de ControlNode. Matar al que
# atiende el trafico dejaria el cluster sin plano de control aunque el otro tomara el lease:
# se veria el traspaso pero no que el servicio sigue. nginx aqui es lo que hace que matar
# a CUALQUIERA de los dos ControlNodes no interrumpa nada. Una septima instancia no
# anadiria nada que esto no de.
#
# ## El limite, dicho antes de la demostracion
#
# Matar la INSTANCIA dfsha-db tumba el cluster entero: PostgreSQL es el punto unico de
# fallo aceptado, con promocion manual (decision 4 del Bloque A; deploy/RUNBOOK-postgres.md).
# Lo que se demuestra aqui es la caida de un ControlNode, no la de la base.
#
# ## Sin interpolacion de compose, a proposito
#
# Todo valor que cambia por despliegue esta ESCRITO en el .env y entra por env_file, donde
# se puede verificar leyendolo. `environment:` solo lleva lo estructural. La interpolacion
# (${...}) lee el .env de deploy/ y no el de la raiz, y ya dejo una vez una URL vacia en
# silencio.

name: "dfsha-db"

services:
  postgres:
    image: "postgres:16"
    container_name: "dfsha-postgres"
    env_file:
      - "../.env"          # POSTGRES_PASSWORD
    environment:
      POSTGRES_USER: "dfsha"
      POSTGRES_DB: "dfsha"
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=10"]
    ports:
      # Al propio grupo de seguridad: el ControlNode de dfsha-control llega por la IP
      # privada. Nunca fuera del grupo: es el unico servicio sin mTLS.
      - "5432:5432"
    volumes:
      - "dfsha-pg:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dfsha -d dfsha"]
      interval: "5s"
      timeout: "3s"
      retries: 20
    restart: "unless-stopped"

  control-node:
    build:
      context: ".."
      dockerfile: "docker/control_node.Dockerfile"
    image: "dfsha/control-node:0.3.0"
    container_name: "dfsha-control-node-b"
    # El MISMO .env que dfsha-control: los dos ControlNodes tienen que compartir el
    # secreto de JWT (un token emitido por uno lo valida el otro) y la URL de la base.
    env_file:
      - "../.env"
    ports:
      # Solo en loopback, y solo para la demostracion: preguntarle a ESTA instancia si es
      # la lider. El trafico real le llega por nginx, dentro de la red de compose.
      - "127.0.0.1:8010:8000"
    volumes:
      - "/etc/dfsha/certs:/etc/dfsha/certs:ro"
    depends_on:
      postgres:
        condition: "service_healthy"
    restart: "unless-stopped"

  lb:
    image: "nginx:1.27-alpine"
    container_name: "dfsha-lb"
    env_file:
      - "../.env"          # DFSHA_CONTROL_A_IP, que las plantillas sustituyen al arrancar
    environment:
      # Nuestro nginx.conf incluye el bloque stream desde aqui.
      NGINX_ENVSUBST_STREAM_OUTPUT_DIR: "/etc/nginx/stream.conf.d"
    ports:
      - "8000:8000"   # REST del cliente, TLS (nivel 7)
      - "8443:8443"   # plano interno con mTLS (nivel 4, passthrough)
      - "9000:9000"   # gRPC con mTLS (nivel 4, passthrough)
    volumes:
      - "../docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
      - "./nginx:/etc/nginx/templates:ro"
      # control.crt/.key para el TLS de cliente en :8000, y ca.crt para verificar a los
      # ControlNodes. Son los mismos ficheros que ya recibe esta instancia.
      - "/etc/dfsha/certs:/etc/nginx/certs:ro"
    depends_on:
      control-node:
        condition: "service_healthy"
    healthcheck:
      # Por la sonda interna de default.conf.template, que habla HTTPS VERIFICADO con los
      # ControlNodes. Ver el comentario de esa plantilla.
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/health || exit 1"]
      interval: "5s"
      timeout: "3s"
      retries: 10
    restart: "unless-stopped"

volumes:
  dfsha-pg:
