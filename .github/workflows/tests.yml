name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      # Valores de prueba: los servicios no arrancan sin estos secretos.
      DFSHA_JWT_SECRET: ci-only-not-a-real-secret
      DFSHA_INTERNAL_SECRET: ci-only-not-a-real-secret
      DFSHA_BLOCK_SIZE: "1048576"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate gRPC code
        # El .proto se versiona y lo generado no, asi que el CI lo regenera en cada
        # ejecucion: eso garantiza que los stubs corresponden al .proto del commit.
        run: python scripts/gen_proto.py

      - name: Run tests
        run: pytest -q
