# Alembic - migraciones del metadato del ControlNode.
#
# La URL de la base NO se pone aqui: la lee `alembic/env.py` de DFSHA_DB_URL, que es la
# misma variable que usa el ControlNode. Tener dos sitios donde declarar la base es como
# se acaba migrando una y arrancando contra otra.
#
#   alembic upgrade head        # aplicar
#   alembic revision -m "..."   # nueva revision (revisar SIEMPRE lo generado)
#   alembic current             # en que revision esta la base

[alembic]
script_location = alembic
prepend_sys_path = src
version_path_separator = os

# Las revisiones se numeran 0001, 0002... y no con hash aleatorio: en un repositorio de
# equipo, el orden de los ficheros en el listado tiene que ser el orden de aplicacion.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
